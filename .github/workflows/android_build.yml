name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

      - name: Build with Gradle
        working-directory: builds/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaintSeiyaDensetsu-Debug-APK
          path: builds/android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SaintSeiyaDensetsu-Release-AAB
          path: builds/android/app/build/outputs/bundle/release/*.aab
